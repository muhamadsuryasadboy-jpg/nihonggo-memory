, {"id": 9, "day": 9, "name": "N4 · Orang dan Tubuh", "at": 0}, {"id": 10, "day": 10, "name": "N4 · Tempat dan Arah", "at": 0}, {"id": 11, "day": 11, "name": "N4 · Kata Kerja", "at": 0}, {"id": 12, "day": 12, "name": "N4 · Sifat dan Warna", "at": 0}, {"id": 13, "day": 13, "name": "N4 · Sekolah dan Kerja", "at": 0}, {"id": 14, "day": 14, "name": "N4 · Makanan dan Barang", "at": 0}, {"id": 15, "day": 15, "name": "N3+ · Alam dan Cuaca", "at": 0}, {"id": 16, "day": 16, "name": "N3+ · Orang dan Tubuh", "at": 0}, {"id": 17, "day": 17, "name": "N3+ · Sekolah dan Kerja", "at": 0}, {"id": 18, "day": 18, "name": "N3+ · Kata Kerja", "at": 0}, {"id": 19, "day": 19, "name": "N3+ · Tempat dan Arah", "at": 0}, {"id": 20, "day": 20, "name": "N3+ · Makanan dan Barang", "at": 0}, {"id": 21, "day": 21, "name": "N3+ · Sifat dan Warna", "at": 0}, {"id": 22, "day": 22, "name": "N3+ · Angka, Waktu, dan Uang", "at": 0}, {"id": 23, "day": 23, "name": "Kata · Angka dan Waktu", "at": 0}, {"id": 24, "day": 24, "name": "Kata · Orang dan Keluarga", "at": 0}, {"id": 25, "day": 25, "name": "Kata · Tempat", "at": 0}, {"id": 26, "day": 26, "name": "Kata · Kata Kerja", "at": 0}, {"id": 27, "day": 27, "name": "Kata · Sifat", "at": 0}, {"id": 28, "day": 28, "name": "Kata · Benda dan Makanan", "at": 0}, {"id": 29, "day": 29, "name": "Kata · Alam dan Cuaca", "at": 0}, {"id": 30, "day": 30, "name": "Kata · Ungkapan dan Lain-lain", "at": 0}, {"id": 31, "day": 31, "name": "Kata · Tambahan Sehari-hari", "at": 0}]}, "pl": {"cards": [{"id": 1, "jp": "AはBです", "ro": "A wa B desu", "me": "A adalah B", "note": "Pola paling dasar buat memperkenalkan diri atau menyebut sesuatu. は dibaca \"wa\" (bukan \"ha\") karena jadi penanda topik. です bikin kalimat jadi sopan. Contoh: わたしは学生です。 (Watashi wa gakusei desu.) = Saya pelajar. | これは本です。 (Kore wa hon desu.) = Ini buku.", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 2, "jp": "AはBじゃありません", "ro": "A wa B ja arimasen", "me": "A bukan B", "note": "Dipakai untuk bilang \"bukan\" atau \"tidak\" setelah kata benda. Versi lebih resmi: ではありません (dewa arimasen). Jangan dipakai untuk kata kerja. Contoh: わたしは医者じゃありません。 (Watashi wa isha ja arimasen.) = Saya bukan dokter. | これはペンじゃありません。 (Kore wa pen ja arimasen.) = Ini bukan pulpen.", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 3, "jp": "AはBですか", "ro": "A wa B desu ka", "me": "Apakah A itu B?", "note": "Tambah か di akhir kalimat untuk jadi pertanyaan. Tidak perlu tanda tanya, dan nada suara naik di akhir. Contoh: あなたは先生ですか。 (Anata wa sensei desu ka.) = Apakah Anda guru? | はい、そうです。 (Hai, sou desu.) = Ya, benar.", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 4, "jp": "AもBです", "ro": "A mo B desu", "me": "A juga B", "note": "も menggantikan は kalau hal yang sama berlaku untuk topik lain. Artinya \"juga\". Contoh: たなかさんも学生です。 (Tanaka-san mo gakusei desu.) = Tanaka juga pelajar. | わたしも行きます。 (Watashi mo ikimasu.) = Saya juga pergi.", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 5, "jp": "AのB", "ro": "A no B", "me": "B milik A / B dari A", "note": "の menyambung dua kata benda. Bisa berarti kepemilikan, asal, atau jenis. Urutannya kebalikan dari bahasa Indonesia: pemilik dulu, baru bendanya. Contoh: これは先生の本です。 (Kore wa sensei no hon desu.) = Ini buku milik guru. | 日本語の先生 (Nihongo no sensei) = guru bahasa Jepang", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 6, "jp": "これ・それ・あれ", "ro": "kore / sore / are", "me": "ini / itu / itu (jauh)", "note": "これ dekat pembicara, それ dekat lawan bicara, あれ jauh dari keduanya. Dipakai sendirian, tidak langsung diikuti benda. Contoh: これは時計です。 (Kore wa tokei desu.) = Ini jam. | あれは何ですか。 (Are wa nan desu ka.) = Itu (jauh) apa?", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 7, "jp": "この・その・あの + benda", "ro": "kono / sono / ano + benda", "me": "benda ini / itu / itu (jauh)", "note": "Beda dengan これ: この harus langsung diikuti kata benda. Contoh: この車は高いです。 (Kono kuruma wa takai desu.) = Mobil ini mahal. | あの人はだれですか。 (Ano hito wa dare desu ka.) = Orang itu siapa?", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 8, "jp": "ここ・そこ・あそこ", "ro": "koko / soko / asoko", "me": "di sini / di situ / di sana", "note": "Dipakai untuk menunjuk tempat. Pertanyaannya どこ (doko). Contoh: ここは学校です。 (Koko wa gakkou desu.) = Ini sekolah. | トイレはあそこです。 (Toire wa asoko desu.) = Toilet ada di sana.", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 9, "jp": "〜はどこですか", "ro": "~ wa doko desu ka", "me": "~ di mana?", "note": "Dipakai untuk menanyakan lokasi. Contoh: 駅はどこですか。 (Eki wa doko desu ka.) = Stasiun di mana? | トイレはどこですか。 (Toire wa doko desu ka.) = Toilet di mana?", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 10, "jp": "〜は何ですか", "ro": "~ wa nan desu ka", "me": "~ itu apa?", "note": "何 dibaca nan (kadang nani). Dipakai untuk bertanya nama atau jenis benda. Contoh: これは何ですか。 (Kore wa nan desu ka.) = Ini apa? | 名前は何ですか。 (Namae wa nan desu ka.) = Namamu siapa?", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 11, "jp": "〜はだれですか", "ro": "~ wa dare desu ka", "me": "~ itu siapa?", "note": "だれ (atau sopan: どなた) untuk bertanya tentang orang. Contoh: あの人はだれですか。 (Ano hito wa dare desu ka.) = Orang itu siapa? | あの方はどなたですか。 (Ano kata wa donata desu ka.) = Beliau itu siapa? (sopan)", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 12, "jp": "〜はいくらですか", "ro": "~ wa ikura desu ka", "me": "berapa harga ~?", "note": "Dipakai saat belanja untuk tanya harga. Contoh: これはいくらですか。 (Kore wa ikura desu ka.) = Ini berapa harganya? | 三百円です。 (Sanbyaku en desu.) = Tiga ratus yen.", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 13, "jp": "〜は〜時です", "ro": "~ wa ~ji desu", "me": "sekarang jam ~", "note": "Untuk menyebut jam. Tanya: 何時ですか (nanji desu ka). Contoh: 今は三時です。 (Ima wa sanji desu.) = Sekarang jam tiga. | 今、何時ですか。 (Ima nanji desu ka.) = Sekarang jam berapa?", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 14, "jp": "AとB", "ro": "A to B", "me": "A dan B", "note": "と menyambung daftar kata benda (hanya benda). Jangan dipakai untuk menyambung kalimat atau kata kerja. Contoh: りんごとみかん (ringo to mikan) = apel dan jeruk | 友達と先生 (tomodachi to sensei) = teman dan guru", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 15, "jp": "AかB", "ro": "A ka B", "me": "A atau B", "note": "か di antara dua pilihan berarti \"atau\". Biasanya dipakai dalam pertanyaan. Contoh: コーヒーか紅茶 (koohii ka koucha) = kopi atau teh | これですか、それですか。 (Kore desu ka, sore desu ka.) = Ini atau itu?", "lv": "N5", "tags": "N5 · Perkenalan dan Kalimat Dasar", "b": 1, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 16, "jp": "〜があります", "ro": "~ ga arimasu", "me": "ada (benda mati)", "note": "あります dipakai untuk benda mati dan tumbuhan. Untuk orang dan hewan pakai います. Contoh: 机があります。 (Tsukue ga arimasu.) = Ada meja. | 時間がありません。 (Jikan ga arimasen.) = Tidak ada waktu.", "lv": "N5", "tags": "N5 · Ada, Posisi, dan Perasaan", "b": 2, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 17, "jp": "〜がいます", "ro": "~ ga imasu", "me": "ada (orang/hewan)", "note": "います untuk makhluk hidup yang bisa bergerak. Jangan tertukar dengan あります. Contoh: 犬がいます。 (Inu ga imasu.) = Ada anjing. | 兄弟がいます。 (Kyoudai ga imasu.) = Saya punya saudara.", "lv": "N5", "tags": "N5 · Ada, Posisi, dan Perasaan", "b": 2, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 18, "jp": "Tempat + に + 〜があります", "ro": "basho ni ~ ga arimasu", "me": "di tempat ada ~", "note": "Pola untuk bilang \"di (tempat) ada (sesuatu)\". Tempatnya diberi に. Contoh: 部屋にテレビがあります。 (Heya ni terebi ga arimasu.) = Di kamar ada TV. | 公園に人がいます。 (Kouen ni hito ga imasu.) = Di taman ada orang.", "lv": "N5", "tags": "N5 · Ada, Posisi, dan Perasaan", "b": 2, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 19, "jp": "〜は〜にあります", "ro": "~ wa ~ni arimasu", "me": "~ ada di ~", "note": "Kebalikan pola di atas: bendanya jadi topik, lokasinya diterangkan. Untuk orang: います. Contoh: 本は机の上にあります。 (Hon wa tsukue no ue ni arimasu.) = Buku ada di atas meja. | ねこは椅子の下にいます。 (Neko wa isu no shita ni imasu.) = Kucing ada di bawah kursi.", "lv": "N5", "tags": "N5 · Ada, Posisi, dan Perasaan", "b": 2, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 20, "jp": "上・下・中・前・後ろ・横", "ro": "ue / shita / naka / mae / ushiro / yoko", "me": "atas / bawah / dalam / depan / belakang / samping", "note": "Kata posisi dipasang setelah の dan sebelum に. Contoh: 机の上に (di atas meja). Contoh: かばんは机の下にあります。 (Kaban wa tsukue no shita ni arimasu.) = Tas ada di bawah meja. | 駅の前に銀行があります。 (Eki no mae ni ginkou ga arimasu.) = Di depan stasiun ada bank.", "lv": "N5", "tags": "N5 · Ada, Posisi, dan Perasaan", "b": 2, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 21, "jp": "〜が好きです", "ro": "~ ga suki desu", "me": "suka ~", "note": "Yang disukai ditandai が, bukan を. Lawannya: 嫌い (kirai) = tidak suka, 大好き = sangat suka. Contoh: わたしは魚が好きです。 (Watashi wa sakana ga suki desu.) = Saya suka ikan. | 野菜は好きじゃありません。 (Yasai wa suki ja arimasen.) = Saya tidak suka sayur.", "lv": "N5", "tags": "N5 · Ada, Posisi, dan Perasaan", "b": 2, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 22, "jp": "〜が分かります", "ro": "~ ga wakarimasu", "me": "mengerti ~", "note": "Yang dimengerti ditandai が. Negatif: 分かりません. Contoh: 日本語が分かります。 (Nihongo ga wakarimasu.) = Saya mengerti bahasa Jepang. | 英語が分かりません。 (Eigo ga wakarimasen.) = Saya tidak mengerti bahasa Inggris.", "lv": "N5", "tags": "N5 · Ada, Posisi, dan Perasaan", "b": 2, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 23, "jp": "〜がほしいです", "ro": "~ ga hoshii desu", "me": "ingin punya ~", "note": "Untuk benda yang diinginkan. Untuk kata kerja pakai ~たい. Biasanya dipakai untuk diri sendiri. Contoh: 新しい車がほしいです。 (Atarashii kuruma ga hoshii desu.) = Saya ingin mobil baru. | お金がほしいです。 (Okane ga hoshii desu.) = Saya ingin uang.", "lv": "N5", "tags": "N5 · Ada, Posisi, dan Perasaan", "b": 2, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 24, "jp": "〜が上手です", "ro": "~ ga jouzu desu", "me": "pandai ~", "note": "Lawannya 下手 (heta). Jangan pakai untuk memuji diri sendiri, terasa sombong. Contoh: 彼女は歌が上手です。 (Kanojo wa uta ga jouzu desu.) = Dia pandai menyanyi. | 料理が下手です。 (Ryouri ga heta desu.) = Saya kurang pandai masak.", "lv": "N5", "tags": "N5 · Ada, Posisi, dan Perasaan", "b": 2, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 25, "jp": "V-ます", "ro": "V-masu", "me": "bentuk sopan (sekarang/akan)", "note": "Bentuk sopan kata kerja. Dipakai untuk kebiasaan, kejadian sekarang, dan masa depan. Waktu ditentukan dari konteks. Contoh: 毎日、日本語を勉強します。 (Mainichi nihongo o benkyou shimasu.) = Setiap hari saya belajar bahasa Jepang. | 明日、学校に行きます。 (Ashita gakkou ni ikimasu.) = Besok saya ke sekolah.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 26, "jp": "V-ません", "ro": "V-masen", "me": "tidak ... (negatif)", "note": "Negatif sopan. Ubah ます menjadi ません. Contoh: 肉を食べません。 (Niku o tabemasen.) = Saya tidak makan daging. | テレビを見ません。 (Terebi o mimasen.) = Saya tidak menonton TV.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 27, "jp": "V-ました", "ro": "V-mashita", "me": "sudah ... (lampau)", "note": "Lampau sopan. Ubah ます menjadi ました. Contoh: 昨日、映画を見ました。 (Kinou eiga o mimashita.) = Kemarin saya nonton film. | 朝ご飯を食べました。 (Asagohan o tabemashita.) = Saya sudah sarapan.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 28, "jp": "V-ませんでした", "ro": "V-masen deshita", "me": "tidak ... (lampau)", "note": "Negatif lampau sopan. Contoh: 昨日、学校に行きませんでした。 (Kinou gakkou ni ikimasen deshita.) = Kemarin saya tidak ke sekolah. | 何も食べませんでした。 (Nani mo tabemasen deshita.) = Saya tidak makan apa pun.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 29, "jp": "〜を V", "ro": "~ o V", "me": "penanda objek", "note": "を (dibaca \"o\") menandai benda yang dikenai pekerjaan. Contoh: 水を飲みます。 (Mizu o nomimasu.) = Saya minum air. | 本を読みます。 (Hon o yomimasu.) = Saya membaca buku.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 30, "jp": "〜に行きます", "ro": "~ ni ikimasu", "me": "pergi ke ~", "note": "に (atau へ) menandai tujuan. Dipakai dengan 行く (pergi), 来る (datang), 帰る (pulang). Contoh: 駅に行きます。 (Eki ni ikimasu.) = Saya pergi ke stasiun. | 日本へ来ました。 (Nihon e kimashita.) = Saya datang ke Jepang.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 31, "jp": "〜で V", "ro": "~ de V", "me": "melakukan di tempat ~", "note": "で menandai tempat berlangsungnya kegiatan. Beda dengan に yang menandai tujuan atau lokasi benda. Contoh: 図書館で本を読みます。 (Toshokan de hon o yomimasu.) = Saya membaca buku di perpustakaan. | レストランで食べます。 (Resutoran de tabemasu.) = Saya makan di restoran.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 32, "jp": "〜で行きます", "ro": "~ de ikimasu", "me": "pergi naik/dengan ~", "note": "で juga menandai alat atau cara. Contoh: 電車で会社に行きます。 (Densha de kaisha ni ikimasu.) = Saya ke kantor naik kereta. | ペンで書きます。 (Pen de kakimasu.) = Saya menulis pakai pulpen.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 33, "jp": "〜と V", "ro": "~ to V", "me": "bersama ~", "note": "と setelah orang artinya \"bersama\". Contoh: 友達と食べます。 (Tomodachi to tabemasu.) = Saya makan bersama teman. | 一人で行きます。 (Hitori de ikimasu.) = Saya pergi sendirian.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 34, "jp": "〜から〜まで", "ro": "~ kara ~ made", "me": "dari ~ sampai ~", "note": "Berlaku untuk waktu dan tempat. Contoh: 九時から五時まで働きます。 (Kuji kara goji made hatarakimasu.) = Saya bekerja dari jam 9 sampai jam 5. | 東京から大阪まで (Toukyou kara oosaka made) = dari Tokyo sampai Osaka", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 35, "jp": "〜に あげます", "ro": "~ ni agemasu", "me": "memberi kepada ~", "note": "Penerimanya ditandai に. Untuk memberi ke diri sendiri atau keluarga pakai くれます. Contoh: 友達に本をあげます。 (Tomodachi ni hon o agemasu.) = Saya memberi buku ke teman. | 母にプレゼントをあげました。 (Haha ni purezento o agemashita.) = Saya memberi hadiah ke ibu.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 36, "jp": "〜に もらいます", "ro": "~ ni moraimasu", "me": "menerima dari ~", "note": "Pemberinya ditandai に atau から. Contoh: 先生に本をもらいました。 (Sensei ni hon o moraimashita.) = Saya menerima buku dari guru. | 友達からお土産をもらいました。 (Tomodachi kara omiyage o moraimashita.) = Saya dapat oleh-oleh dari teman.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 37, "jp": "何も・だれも + negatif", "ro": "nani mo / dare mo + negatif", "me": "tidak ada apa pun / tidak ada siapa pun", "note": "何も dan だれも selalu dipakai dengan kalimat negatif. Contoh: 何も食べません。 (Nani mo tabemasen.) = Saya tidak makan apa pun. | だれもいません。 (Dare mo imasen.) = Tidak ada siapa pun.", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 38, "jp": "いくつ・何人・何個", "ro": "ikutsu / nannin / nanko", "me": "berapa banyak", "note": "Dipakai untuk menanyakan jumlah. Orang: 何人, benda kecil: 何個, benda umum: いくつ. Contoh: りんごはいくつありますか。 (Ringo wa ikutsu arimasu ka.) = Ada berapa apel? | 何人家族ですか。 (Nannin kazoku desu ka.) = Keluargamu berapa orang?", "lv": "N5", "tags": "N5 · Kata Kerja Dasar", "b": 3, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 39, "jp": "V-ませんか", "ro": "V-masen ka", "me": "Maukah ...? (ajakan)", "note": "Bentuk negatif + か terdengar sopan untuk mengajak, jadi tidak memaksa. Contoh: いっしょに食べませんか。 (Issho ni tabemasen ka.) = Mau makan bareng? | コーヒーを飲みませんか。 (Koohii o nomimasen ka.) = Mau minum kopi?", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 40, "jp": "V-ましょう", "ro": "V-mashou", "me": "Ayo ...", "note": "Dipakai untuk mengajak atau menyetujui ajakan. Lebih kuat dari ませんか. Contoh: 行きましょう。 (Ikimashou.) = Ayo pergi. | はい、食べましょう。 (Hai, tabemashou.) = Ya, ayo makan.", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 41, "jp": "V-ましょうか", "ro": "V-mashou ka", "me": "Mau saya ...?", "note": "Dipakai untuk menawarkan bantuan. Contoh: 荷物を持ちましょうか。 (Nimotsu o mochimashou ka.) = Mau saya bawakan barangnya? | 手伝いましょうか。 (Tetsudaimashou ka.) = Mau saya bantu?", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 42, "jp": "V-たいです", "ro": "V-tai desu", "me": "ingin ...", "note": "Ubah ます jadi たい. Dipakai untuk keinginan sendiri. Negatif: たくないです. Contoh: 日本に行きたいです。 (Nihon ni ikitai desu.) = Saya ingin pergi ke Jepang. | 何も食べたくないです。 (Nani mo tabetakunai desu.) = Saya tidak ingin makan apa pun.", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 43, "jp": "V(masu)-に行きます", "ro": "V-ni ikimasu", "me": "pergi untuk ...", "note": "Tujuan pergi dinyatakan dengan bentuk ます tanpa ます + に. Contoh: 買い物に行きます。 (Kaimono ni ikimasu.) = Saya pergi belanja. | ご飯を食べに行きます。 (Gohan o tabe ni ikimasu.) = Saya pergi makan.", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 44, "jp": "V-てください", "ro": "V-te kudasai", "me": "Tolong ...", "note": "Meminta orang melakukan sesuatu. Cukup sopan untuk sehari-hari. Contoh: ここに書いてください。 (Koko ni kaite kudasai.) = Tolong tulis di sini. | ちょっと待ってください。 (Chotto matte kudasai.) = Tolong tunggu sebentar.", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 45, "jp": "V-ないでください", "ro": "V-naide kudasai", "me": "Tolong jangan ...", "note": "Meminta orang tidak melakukan sesuatu. Contoh: ここで写真を撮らないでください。 (Koko de shashin o toranaide kudasai.) = Tolong jangan foto di sini. | 忘れないでください。 (Wasurenaide kudasai.) = Tolong jangan lupa.", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 46, "jp": "V-ています", "ro": "V-te imasu", "me": "sedang ... / keadaan", "note": "Dipakai untuk kegiatan yang sedang berlangsung, juga untuk keadaan, kebiasaan, atau pekerjaan. Contoh: 今、勉強しています。 (Ima benkyou shite imasu.) = Sekarang saya sedang belajar. | 東京に住んでいます。 (Toukyou ni sunde imasu.) = Saya tinggal di Tokyo.", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 47, "jp": "V-てもいいです", "ro": "V-te mo ii desu", "me": "boleh ...", "note": "Memberi atau meminta izin. Tanya: V-てもいいですか. Contoh: ここに座ってもいいです。 (Koko ni suwatte mo ii desu.) = Boleh duduk di sini. | 写真を撮ってもいいですか。 (Shashin o totte mo ii desu ka.) = Boleh saya foto?", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 48, "jp": "V-てはいけません", "ro": "V-te wa ikemasen", "me": "tidak boleh ...", "note": "Larangan. Lebih keras dari ないでください. Contoh: ここで食べてはいけません。 (Koko de tabete wa ikemasen.) = Tidak boleh makan di sini. | 走ってはいけません。 (Hashitte wa ikemasen.) = Tidak boleh berlari.", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 49, "jp": "もう V-ました", "ro": "mou V-mashita", "me": "sudah ...", "note": "もう artinya \"sudah\". Tanya: もう食べましたか (sudah makan?). Contoh: もう宿題をしました。 (Mou shukudai o shimashita.) = Saya sudah mengerjakan PR. | もう食べましたか。 (Mou tabemashita ka.) = Sudah makan?", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 50, "jp": "まだ V-ていません", "ro": "mada V-te imasen", "me": "belum ...", "note": "まだ artinya \"belum\". Jawaban untuk pertanyaan もう~ましたか. Contoh: まだ食べていません。 (Mada tabete imasen.) = Saya belum makan. | まだ分かりません。 (Mada wakarimasen.) = Saya belum mengerti.", "lv": "N5", "tags": "N5 · Ajakan, Permintaan, dan Izin", "b": 4, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 51, "jp": "い-adj + です", "ro": "i-adj + desu", "me": "sifat (い)", "note": "Kata sifat yang berakhir い. Cukup tambah です untuk sopan. Contoh: この本は高いです。 (Kono hon wa takai desu.) = Buku ini mahal. | 天気がいいです。 (Tenki ga ii desu.) = Cuacanya bagus.", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 52, "jp": "い-adj → くないです", "ro": "i-adj → ku nai desu", "me": "negatif sifat い", "note": "Ganti い terakhir menjadi くない. Khusus いい jadi よくない. Contoh: この本は高くないです。 (Kono hon wa takaku nai desu.) = Buku ini tidak mahal. | 天気がよくないです。 (Tenki ga yokunai desu.) = Cuacanya tidak bagus.", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 53, "jp": "い-adj → かったです", "ro": "i-adj → katta desu", "me": "sifat い lampau", "note": "Ganti い menjadi かった untuk lampau. Negatif lampau: くなかったです. Contoh: 昨日は暑かったです。 (Kinou wa atsukatta desu.) = Kemarin panas. | 映画はおもしろくなかったです。 (Eiga wa omoshirokunakatta desu.) = Filmnya tidak seru.", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 54, "jp": "な-adj + です / じゃありません", "ro": "na-adj + desu / ja arimasen", "me": "sifat (な)", "note": "Sifat な dipakai seperti kata benda: tinggal tambah です. Negatif pakai じゃありません. Contoh: ここは静かです。 (Koko wa shizuka desu.) = Di sini tenang. | この町は便利じゃありません。 (Kono machi wa benri ja arimasen.) = Kota ini tidak praktis.", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 55, "jp": "な-adj → でした", "ro": "na-adj → deshita", "me": "sifat な lampau", "note": "Lampau な-adj: でした. Negatif lampau: じゃありませんでした. Contoh: 昨日は暇でした。 (Kinou wa hima deshita.) = Kemarin saya senggang. | あの店は静かでした。 (Ano mise wa shizuka deshita.) = Toko itu tenang.", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 56, "jp": "い-adj + benda", "ro": "i-adj + benda", "me": "sifat sebelum benda", "note": "Sifat い langsung di depan benda tanpa tambahan apa pun. Contoh: 大きい家 (ookii ie) = rumah besar | 新しい車 (atarashii kuruma) = mobil baru", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 57, "jp": "な-adj + な + benda", "ro": "na-adj + na + benda", "me": "sifat な sebelum benda", "note": "Sifat な harus pakai な saat menerangkan benda. Contoh: 静かな町 (shizuka na machi) = kota yang tenang | きれいな花 (kirei na hana) = bunga yang indah", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 58, "jp": "AはBより〜です", "ro": "A wa B yori ~ desu", "me": "A lebih ~ daripada B", "note": "より artinya \"daripada\". Yang dibandingkan lebih dulu, lalu pembandingnya. Contoh: 犬は猫より大きいです。 (Inu wa neko yori ookii desu.) = Anjing lebih besar dari kucing. | 電車はバスより速いです。 (Densha wa basu yori hayai desu.) = Kereta lebih cepat dari bus.", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 59, "jp": "AよりBのほうが〜です", "ro": "A yori B no hou ga ~ desu", "me": "B lebih ~ daripada A", "note": "Fokus pada yang lebih unggul: B. Contoh: 電車のほうが速いです。 (Densha no hou ga hayai desu.) = Kereta lebih cepat. | 夏より冬のほうが好きです。 (Natsu yori fuyu no hou ga suki desu.) = Saya lebih suka musim dingin daripada panas.", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 60, "jp": "〜でいちばん〜", "ro": "~ de ichiban ~", "me": "paling ~ di antara ~", "note": "Dipakai untuk superlatif. 一番 artinya \"nomor satu\". Contoh: クラスでいちばん背が高いです。 (Kurasu de ichiban se ga takai desu.) = Paling tinggi di kelas. | 何がいちばん好きですか。 (Nani ga ichiban suki desu ka.) = Kamu paling suka apa?", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 61, "jp": "い-adj → くて", "ro": "i-adj → kute", "me": "menyambung sifat", "note": "Ganti い menjadi くて untuk menyambung dua sifat atau alasan. Untuk な-adj pakai で. Contoh: 安くておいしいです。 (Yasukute oishii desu.) = Murah dan enak. | 静かできれいです。 (Shizuka de kirei desu.) = Tenang dan indah.", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 62, "jp": "〜が、〜", "ro": "~ ga, ~", "me": "tetapi", "note": "Menyambung dua kalimat yang berlawanan. Contoh: 高いですが、いい車です。 (Takai desu ga, ii kuruma desu.) = Mahal, tetapi mobil bagus. | 日本語は難しいですが、おもしろいです。 (Nihongo wa muzukashii desu ga, omoshiroi desu.) = Bahasa Jepang sulit, tetapi seru.", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 63, "jp": "どう・どんな", "ro": "dou / donna", "me": "bagaimana / seperti apa", "note": "どう menanyakan keadaan, どんな + benda menanyakan jenis. Contoh: 日本はどうですか。 (Nihon wa dou desu ka.) = Bagaimana Jepang? | どんな食べ物が好きですか。 (Donna tabemono ga suki desu ka.) = Suka makanan seperti apa?", "lv": "N5", "tags": "N5 · Kata Sifat dan Perbandingan", "b": 5, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 64, "jp": "V-る + ことができます", "ro": "V-ru koto ga dekimasu", "me": "bisa ...", "note": "Bentuk kamus + こと + ができます = punya kemampuan atau kesempatan untuk melakukan sesuatu. Contoh: 日本語を話すことができます。 (Nihongo o hanasu koto ga dekimasu.) = Saya bisa berbicara bahasa Jepang. | ここで泳ぐことができます。 (Koko de oyogu koto ga dekimasu.) = Di sini boleh/bisa berenang.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 65, "jp": "V-ない", "ro": "V-nai", "me": "bentuk biasa negatif", "note": "Dipakai bicara santai dengan teman atau di dalam kalimat panjang. Bentuk sopan: ません. Contoh: 今日は行かない。 (Kyou wa ikanai.) = Hari ini tidak pergi. | 肉は食べない。 (Niku wa tabenai.) = Saya tidak makan daging.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 66, "jp": "V-た", "ro": "V-ta", "me": "bentuk biasa lampau", "note": "Lampau bentuk biasa, bentuk sopan: ました. Contoh: 昨日、友達に会った。 (Kinou tomodachi ni atta.) = Kemarin bertemu teman. | ご飯を食べた。 (Gohan o tabeta.) = Sudah makan.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 67, "jp": "V-たことがあります", "ro": "V-ta koto ga arimasu", "me": "pernah ...", "note": "Dipakai untuk pengalaman di masa lalu. Contoh: 日本に行ったことがあります。 (Nihon ni itta koto ga arimasu.) = Saya pernah ke Jepang. | 寿司を食べたことがありません。 (Sushi o tabeta koto ga arimasen.) = Saya belum pernah makan sushi.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 68, "jp": "V-ながら", "ro": "V-nagara", "me": "sambil ...", "note": "Dua kegiatan berjalan bersamaan oleh orang yang sama. Kegiatan utama di akhir kalimat. Contoh: 音楽を聞きながら勉強します。 (Ongaku o kikinagara benkyou shimasu.) = Belajar sambil dengar musik. | 歩きながら食べないでください。 (Arukinagara tabenaide kudasai.) = Jangan makan sambil jalan.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 69, "jp": "V-たり V-たり します", "ro": "V-tari V-tari shimasu", "me": "kadang ..., kadang ...", "note": "Menyebut beberapa contoh kegiatan, tidak lengkap. Contoh: 休みの日は寝たり本を読んだりします。 (Yasumi no hi wa netari hon o yondari shimasu.) = Hari libur saya tidur, baca buku, dan lain-lain. | 日曜日は買い物をしたり映画を見たりします。 (Nichiyoubi wa kaimono o shitari eiga o mitari shimasu.) = Hari Minggu saya belanja, nonton film, dan lain-lain.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 70, "jp": "V-なければなりません", "ro": "V-nakereba narimasen", "me": "harus ...", "note": "Kewajiban. Bisa disingkat jadi V-なきゃ dalam percakapan santai. Contoh: 薬を飲まなければなりません。 (Kusuri o nomanakereba narimasen.) = Saya harus minum obat. | 早く寝なければなりません。 (Hayaku nenakereba narimasen.) = Saya harus tidur cepat.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 71, "jp": "V-なくてもいいです", "ro": "V-nakute mo ii desu", "me": "tidak perlu ...", "note": "Kebalikan dari kewajiban: boleh tidak dilakukan. Contoh: 明日は来なくてもいいです。 (Ashita wa konakute mo ii desu.) = Besok tidak perlu datang. | 急がなくてもいいです。 (Isoganakute mo ii desu.) = Tidak perlu buru-buru.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 72, "jp": "V-たほうがいいです", "ro": "V-ta hou ga ii desu", "me": "sebaiknya ...", "note": "Saran. Kalau melarang: V-ないほうがいいです (sebaiknya jangan). Contoh: 早く寝たほうがいいです。 (Hayaku neta hou ga ii desu.) = Sebaiknya tidur cepat. | 飲みすぎないほうがいいです。 (Nomisuginai hou ga ii desu.) = Sebaiknya jangan minum berlebihan.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 73, "jp": "〜から、〜", "ro": "~ kara, ~", "me": "karena ~, jadi ~", "note": "から setelah alasan. Alasan dulu, hasilnya kemudian. Bisa juga diletakkan di akhir untuk menjelaskan. Contoh: 忙しいですから、行きません。 (Isogashii desu kara, ikimasen.) = Karena sibuk, saya tidak pergi. | 雨ですから、傘を持って行きます。 (Ame desu kara, kasa o motte ikimasu.) = Karena hujan, saya bawa payung.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 74, "jp": "〜ので、〜", "ro": "~ node, ~", "me": "karena ~ (lebih halus)", "note": "Mirip から tapi lebih lembut, cocok untuk alasan ke orang yang lebih tua. Contoh: 雨なので、出かけません。 (Ame na node, dekakemasen.) = Karena hujan, saya tidak keluar. | 頭が痛いので、休みます。 (Atama ga itai node, yasumimasu.) = Karena kepala sakit, saya istirahat.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 75, "jp": "V-てから、〜", "ro": "V-te kara, ~", "me": "setelah ..., lalu ...", "note": "Urutan kejadian: yang pertama selesai dulu. Contoh: 食べてから、勉強します。 (Tabete kara, benkyou shimasu.) = Setelah makan, saya belajar. | 宿題をしてから、寝ます。 (Shukudai o shite kara, nemasu.) = Setelah PR, saya tidur.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 76, "jp": "V-る前に、〜", "ro": "V-ru mae ni, ~", "me": "sebelum ...", "note": "Kata kerja sebelum 前に selalu bentuk kamus, tidak peduli lampau atau tidak. Contoh: 寝る前に、歯を磨きます。 (Neru mae ni, ha o migakimasu.) = Sebelum tidur, saya sikat gigi. | 食べる前に、手を洗います。 (Taberu mae ni, te o araimasu.) = Sebelum makan, saya cuci tangan.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 77, "jp": "〜とき、〜", "ro": "~ toki, ~", "me": "ketika ~", "note": "Menyambung dua kejadian pada waktu yang sama. Contoh: 暇なとき、映画を見ます。 (Hima na toki, eiga o mimasu.) = Kalau senggang, saya nonton film. | 日本に行ったとき、写真を撮りました。 (Nihon ni itta toki, shashin o torimashita.) = Waktu ke Jepang, saya foto-foto.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 78, "jp": "V-ておきます", "ro": "V-te okimasu", "me": "... dulu (persiapan)", "note": "Melakukan sesuatu sebelumnya untuk persiapan. Contoh: ホテルを予約しておきます。 (Hoteru o yoyaku shite okimasu.) = Saya pesan hotel dulu. | 窓を開けておきます。 (Mado o akete okimasu.) = Saya biarkan jendela terbuka.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 79, "jp": "V-てしまいます", "ro": "V-te shimaimasu", "me": "sudah terlanjur ... / selesai ...", "note": "Bisa berarti selesai total atau menyesal telah melakukan sesuatu. Santai: V-ちゃった. Contoh: 宿題を忘れてしまいました。 (Shukudai o wasurete shimaimashita.) = Duh, saya lupa PR. | 全部食べてしまいました。 (Zenbu tabete shimaimashita.) = Saya habiskan semuanya.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 80, "jp": "V-てみます", "ro": "V-te mimasu", "me": "mencoba ...", "note": "Mencoba melakukan sesuatu untuk melihat hasilnya. Contoh: このケーキを食べてみます。 (Kono keeki o tabete mimasu.) = Saya coba kue ini. | 着てみてもいいですか。 (Kite mite mo ii desu ka.) = Boleh saya coba pakai?", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 81, "jp": "V-ています(hasil)", "ro": "V-te imasu (keadaan)", "me": "keadaan sekarang", "note": "Beberapa kata kerja bermakna \"sudah dan masih dalam keadaan itu\". Contoh: 窓が開いています。 (Mado ga aite imasu.) = Jendelanya terbuka. | 結婚しています。 (Kekkon shite imasu.) = Sudah menikah.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 82, "jp": "V-やすい・V-にくい", "ro": "V-yasui / V-nikui", "me": "mudah / sulit ...", "note": "Menambah ~やすい (mudah) atau ~にくい (sulit) pada bentuk ます tanpa ます. Contoh: このペンは書きやすいです。 (Kono pen wa kakiyasui desu.) = Pulpen ini enak dipakai nulis. | この漢字は読みにくいです。 (Kono kanji wa yominikui desu.) = Kanji ini susah dibaca.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 83, "jp": "V-すぎます", "ro": "V-sugimasu", "me": "terlalu ...", "note": "Dipakai untuk kata kerja dan sifat. い-adj: ~すぎます, な-adj sama. Contoh: 食べすぎました。 (Tabesugimashita.) = Saya makan terlalu banyak. | この本は高すぎます。 (Kono hon wa takasugimasu.) = Buku ini terlalu mahal.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 84, "jp": "〜になります・〜くなります", "ro": "~ ni narimasu / ~ ku narimasu", "me": "menjadi ~", "note": "Perubahan keadaan. Kata benda/な-adj: になります, い-adj: くなります. Contoh: 寒くなりました。 (Samuku narimashita.) = Sudah jadi dingin. | 医者になりたいです。 (Isha ni naritai desu.) = Saya ingin jadi dokter.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 85, "jp": "〜にします", "ro": "~ ni shimasu", "me": "memutuskan ~", "note": "Dipakai saat memilih, misalnya di restoran. Contoh: わたしはコーヒーにします。 (Watashi wa koohii ni shimasu.) = Saya pilih kopi. | これにします。 (Kore ni shimasu.) = Saya ambil yang ini.", "lv": "N4", "tags": "N4 · Bentuk Biasa dan Dasar N4", "b": 6, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 86, "jp": "〜と思います", "ro": "~ to omoimasu", "me": "saya pikir ~", "note": "と menandai isi pikiran. Sebelum と pakai bentuk biasa. Contoh: 明日は雨だと思います。 (Ashita wa ame da to omoimasu.) = Saya pikir besok hujan. | 彼は来ないと思います。 (Kare wa konai to omoimasu.) = Saya pikir dia tidak datang.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 87, "jp": "〜でしょう", "ro": "~ deshou", "me": "mungkin / ya kan?", "note": "Dipakai untuk menebak atau meminta persetujuan. Nada naik = meminta setuju. Contoh: 明日は暑いでしょう。 (Ashita wa atsui deshou.) = Besok mungkin panas. | これは高いでしょう? (Kore wa takai deshou?) = Ini mahal, kan?", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 88, "jp": "〜かもしれません", "ro": "~ kamoshiremasen", "me": "mungkin saja ~", "note": "Kemungkinan lebih lemah dari でしょう. Dipakai saat ragu. Contoh: 雨が降るかもしれません。 (Ame ga furu kamoshiremasen.) = Mungkin hujan. | 彼は知らないかもしれません。 (Kare wa shiranai kamoshiremasen.) = Mungkin dia tidak tahu.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 89, "jp": "〜はずです", "ro": "~ hazu desu", "me": "seharusnya ~", "note": "Perkiraan berdasarkan alasan kuat. Contoh: 彼はもう着いたはずです。 (Kare wa mou tsuita hazu desu.) = Seharusnya dia sudah sampai. | そんなはずはありません。 (Sonna hazu wa arimasen.) = Mustahil begitu.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 90, "jp": "〜そうです(kelihatannya)", "ro": "~ sou desu", "me": "kelihatannya ~", "note": "Ambil akar sifat atau bentuk ます tanpa ます + そうです. Berdasarkan penampilan. Contoh: おいしそうです。 (Oishisou desu.) = Kelihatannya enak. | 雨が降りそうです。 (Ame ga furisou desu.) = Sepertinya mau hujan.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 91, "jp": "〜そうです(katanya)", "ro": "~ sou desu (denger)", "me": "katanya ~", "note": "Memakai bentuk biasa + そうです. Berdasarkan kabar yang didengar, bukan penampilan. Contoh: 明日は雨が降るそうです。 (Ashita wa ame ga furu sou desu.) = Katanya besok hujan. | 彼は先生だそうです。 (Kare wa sensei da sou desu.) = Katanya dia guru.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 92, "jp": "〜ようです", "ro": "~ you desu", "me": "sepertinya ~", "note": "Dugaan dari apa yang dilihat/dirasakan sendiri. Contoh: だれもいないようです。 (Dare mo inai you desu.) = Sepertinya tidak ada orang. | 風邪をひいたようです。 (Kaze o hiita you desu.) = Sepertinya saya masuk angin.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 93, "jp": "〜らしい", "ro": "~ rashii", "me": "katanya / sepertinya", "note": "Dugaan dari kabar atau tanda yang didengar. Contoh: 彼は結婚するらしいです。 (Kare wa kekkon suru rashii desu.) = Katanya dia mau menikah. | あの店はおいしいらしいです。 (Ano mise wa oishii rashii desu.) = Katanya toko itu enak.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 94, "jp": "〜という", "ro": "~ to iu", "me": "yang disebut ~", "note": "Dipakai untuk menyebutkan nama atau isi. Contoh: 「さくら」という花 (\"Sakura\" to iu hana) = bunga yang disebut sakura | 山田さんという人 (Yamada-san to iu hito) = orang bernama Yamada", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 95, "jp": "〜かどうか", "ro": "~ ka dou ka", "me": "apakah ~ atau tidak", "note": "Dipakai dalam kalimat bertanya tidak langsung. Contoh: 行くかどうか分かりません。 (Iku ka dou ka wakarimasen.) = Saya belum tahu pergi atau tidak. | 本当かどうか、調べます。 (Hontou ka dou ka, shirabemasu.) = Saya akan cek benar atau tidak.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 96, "jp": "〜つもりです", "ro": "~ tsumori desu", "me": "berniat ~", "note": "Rencana atau niat sendiri. Negatif: V-ないつもりです. Contoh: 来年、日本に行くつもりです。 (Rainen nihon ni iku tsumori desu.) = Tahun depan saya berniat ke Jepang. | 今日は勉強しないつもりです。 (Kyou wa benkyou shinai tsumori desu.) = Hari ini saya tidak berniat belajar.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 97, "jp": "〜予定です", "ro": "~ yotei desu", "me": "berencana ~", "note": "Rencana yang sudah dijadwalkan. Contoh: 明日、友達に会う予定です。 (Ashita tomodachi ni au yotei desu.) = Besok saya ada janji bertemu teman. | 来週、出張する予定です。 (Raishuu shucchou suru yotei desu.) = Minggu depan saya berencana dinas.", "lv": "N4", "tags": "N4 · Perkiraan, Kesan, dan Pendapat", "b": 7, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 98, "jp": "V-たら、〜", "ro": "V-tara, ~", "me": "kalau/jika ...", "note": "Dipakai untuk syarat dan kejadian yang diikuti hasil. Paling bebas dipakai. Contoh: 雨が降ったら、行きません。 (Ame ga futtara, ikimasen.) = Kalau hujan, saya tidak pergi. | 安かったら、買います。 (Yasukattara, kaimasu.) = Kalau murah, saya beli.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 99, "jp": "〜ば、〜", "ro": "~ ba, ~", "me": "kalau (syarat)", "note": "Syarat mutlak. Contoh: 食べれば (kalau makan), 安ければ (kalau murah). Contoh: 急げば、間に合います。 (Isogeba, maniaimasu.) = Kalau buru-buru, sempat. | 雨が降れば、中止です。 (Ame ga fureba, chuushi desu.) = Kalau hujan, dibatalkan.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 100, "jp": "V-る・と、〜", "ro": "V-ru to, ~", "me": "begitu ... maka ...", "note": "Hasil yang pasti terjadi begitu syarat terpenuhi (hukum alam). Contoh: 春になると、花が咲きます。 (Haru ni naru to, hana ga sakimasu.) = Kalau musim semi tiba, bunga mekar. | このボタンを押すと、水が出ます。 (Kono botan o osu to, mizu ga demasu.) = Kalau tombol ini ditekan, air keluar.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 101, "jp": "〜なら、〜", "ro": "~ nara, ~", "me": "kalau memang ~", "note": "Dipakai menanggapi apa yang dikatakan orang lain. Contoh: 行くなら、早く行きましょう。 (Iku nara, hayaku ikimashou.) = Kalau memang pergi, ayo cepat. | 安いなら、買いたいです。 (Yasui nara, kaitai desu.) = Kalau murah, saya mau beli.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 102, "jp": "V-ても、〜", "ro": "V-te mo, ~", "me": "meskipun ...", "note": "Hasilnya tetap sama walau ada syarat. Contoh: 雨が降っても、行きます。 (Ame ga futte mo, ikimasu.) = Meskipun hujan, saya tetap pergi. | 高くても、買います。 (Takakute mo, kaimasu.) = Meskipun mahal, saya beli.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 103, "jp": "〜のに、〜", "ro": "~ noni, ~", "me": "padahal ~", "note": "Menyatakan hasil yang tidak sesuai harapan. Contoh: 勉強したのに、できませんでした。 (Benkyou shita noni, dekimasen deshita.) = Padahal sudah belajar, tidak bisa. | 春なのに、寒いです。 (Haru na noni, samui desu.) = Padahal musim semi, tapi dingin.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 104, "jp": "〜しか〜ない", "ro": "~ shika ~ nai", "me": "hanya ~ saja", "note": "しか selalu dengan kalimat negatif, artinya \"hanya\". Kesan: sedikit. Contoh: お金が千円しかありません。 (Okane ga sen'en shika arimasen.) = Uang saya cuma seribu yen. | 一人しか来ませんでした。 (Hitori shika kimasen deshita.) = Hanya satu orang yang datang.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 105, "jp": "〜だけ", "ro": "~ dake", "me": "hanya ~", "note": "Mirip しか tapi dipakai dengan kalimat positif. Contoh: 水だけ飲みます。 (Mizu dake nomimasu.) = Saya hanya minum air. | 少しだけ分かります。 (Sukoshi dake wakarimasu.) = Saya mengerti sedikit saja.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 106, "jp": "V-るために、〜", "ro": "V-ru tame ni, ~", "me": "untuk ... / demi ...", "note": "Menyatakan tujuan. Kata kerja yang dipakai harus yang disengaja. Contoh: 日本へ行くために、お金をためます。 (Nihon e iku tame ni, okane o tamemasu.) = Saya menabung untuk ke Jepang. | 健康のために、運動します。 (Kenkou no tame ni, undou shimasu.) = Demi kesehatan, saya olahraga.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 107, "jp": "V-るように、〜", "ro": "V-ru you ni, ~", "me": "supaya ... / agar ...", "note": "Tujuan yang tidak sepenuhnya dikendalikan (sering kata kerja potensial/tidak sengaja). Contoh: 忘れないように、メモします。 (Wasurenai you ni, memo shimasu.) = Saya mencatat supaya tidak lupa. | 聞こえるように、大きい声で話します。 (Kikoeru you ni, ookii koe de hanashimasu.) = Saya bicara keras supaya terdengar.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 108, "jp": "V-ることにします", "ro": "V-ru koto ni shimasu", "me": "memutuskan untuk ...", "note": "Keputusan sendiri. Kalau keputusan dari luar: ことになりました. Contoh: 毎日走ることにしました。 (Mainichi hashiru koto ni shimashita.) = Saya memutuskan lari tiap hari. | 来年、結婚することになりました。 (Rainen kekkon suru koto ni narimashita.) = Diputuskan tahun depan menikah.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 109, "jp": "V-るようになります", "ro": "V-ru you ni narimasu", "me": "jadi bisa/mulai ...", "note": "Perubahan kemampuan atau kebiasaan. Contoh: 日本語が話せるようになりました。 (Nihongo ga hanaseru you ni narimashita.) = Sekarang saya sudah bisa bicara bahasa Jepang. | 毎日朝ご飯を食べるようになりました。 (Mainichi asagohan o taberu you ni narimashita.) = Sekarang saya jadi sarapan tiap hari.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 110, "jp": "V-たばかりです", "ro": "V-ta bakari desu", "me": "baru saja ...", "note": "Menunjukkan kejadian yang barusan terjadi. Contoh: さっき食べたばかりです。 (Sakki tabeta bakari desu.) = Saya baru saja makan. | 日本に来たばかりです。 (Nihon ni kita bakari desu.) = Saya baru datang ke Jepang.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 111, "jp": "V-るところです", "ro": "V-ru tokoro desu", "me": "sedang akan / sedang / baru selesai", "note": "V-る = akan mulai, V-ている = sedang, V-た = baru selesai. Contoh: 今、出かけるところです。 (Ima dekakeru tokoro desu.) = Saya baru mau berangkat. | ご飯を食べているところです。 (Gohan o tabete iru tokoro desu.) = Saya sedang makan.", "lv": "N4", "tags": "N4 · Syarat, Alasan, dan Meskipun", "b": 8, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 112, "jp": "V(potensial)", "ro": "V-reru / V-eru", "me": "bisa ...", "note": "Bentuk kemampuan. Golongan 2: ~られる, golongan 1: ubah akhiran ke -e + る. Contoh: 食べられる, 読める. Contoh: わたしは泳げます。 (Watashi wa oyogemasu.) = Saya bisa berenang. | 日本語が読めますか。 (Nihongo ga yomemasu ka.) = Bisa baca bahasa Jepang?", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 113, "jp": "V-られる(pasif)", "ro": "V-rareru (pasif)", "me": "di... (oleh orang)", "note": "Subjek menerima tindakan dari orang lain. Pelaku ditandai に. Contoh: 先生にほめられました。 (Sensei ni homeraremashita.) = Saya dipuji guru. | 犬にかまれました。 (Inu ni kamaremashita.) = Saya digigit anjing.", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 114, "jp": "V-させる(kausatif)", "ro": "V-saseru (kausatif)", "me": "menyuruh/membiarkan ...", "note": "Menyuruh atau mengizinkan orang melakukan sesuatu. Contoh: 子どもに野菜を食べさせます。 (Kodomo ni yasai o tabesasemasu.) = Saya menyuruh anak makan sayur. | 行かせてください。 (Ikasete kudasai.) = Tolong izinkan saya pergi.", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 115, "jp": "お V-ください", "ro": "o V-kudasai", "me": "silakan ... (sopan)", "note": "Bentuk hormat untuk mengajak orang melakukan sesuatu. Contoh: こちらにお座りください。 (Kochira ni osuwari kudasai.) = Silakan duduk di sini. | 少々お待ちください。 (Shoushou omachi kudasai.) = Mohon tunggu sebentar.", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 116, "jp": "お V-になります", "ro": "o V-ni narimasu", "me": "(orang lain) ... (hormat)", "note": "Menghormati orang lain (sonkeigo). Jangan dipakai untuk diri sendiri. Contoh: 社長はもうお帰りになりました。 (Shachou wa mou okaeri ni narimashita.) = Direktur sudah pulang. | 先生はお読みになりましたか。 (Sensei wa oyomi ni narimashita ka.) = Apakah guru sudah membaca?", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 117, "jp": "V-ていただきます", "ro": "V-te itadakimasu", "me": "dibantu / diberi (rendah hati)", "note": "Versi sopan dari V-てもらいます. Pembicara menerima kebaikan. Contoh: 先生に教えていただきました。 (Sensei ni oshiete itadakimashita.) = Guru mengajari saya (dengan rendah hati). | 手伝っていただけませんか。 (Tetsudatte itadakemasen ka.) = Maukah Anda membantu saya?", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 118, "jp": "V-てくれます", "ro": "V-te kuremasu", "me": "(orang) melakukan untukku", "note": "Orang lain berbuat baik kepada kita. Pelaku ditandai が. Contoh: 友達が手伝ってくれました。 (Tomodachi ga tetsudatte kuremashita.) = Teman membantu saya. | 母が料理を作ってくれました。 (Haha ga ryouri o tsukutte kuremashita.) = Ibu membuatkan masakan untuk saya.", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 119, "jp": "V-てあげます", "ro": "V-te agemasu", "me": "melakukan untuk orang lain", "note": "Kita berbuat baik pada orang lain. Hati-hati, bisa terdengar sombong kalau ke atasan. Contoh: 友達に教えてあげます。 (Tomodachi ni oshiete agemasu.) = Saya mengajari teman. | 弟に本を読んであげました。 (Otouto ni hon o yonde agemashita.) = Saya bacakan buku untuk adik.", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 120, "jp": "V-てもらいます", "ro": "V-te moraimasu", "me": "dibantu orang", "note": "Kita menerima kebaikan dari orang lain. Pelaku ditandai に. Contoh: 先生に教えてもらいました。 (Sensei ni oshiete moraimashita.) = Saya diajari guru. | 友達に写真を撮ってもらいました。 (Tomodachi ni shashin o totte moraimashita.) = Saya difotokan teman.", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 121, "jp": "くださいます・いただきます", "ro": "kudasaimasu / itadakimasu", "me": "memberi / menerima (hormat)", "note": "Dipakai ke orang yang lebih tinggi. くださいます = beliau memberi, いただきます = saya menerima. Contoh: 先生が本をくださいました。 (Sensei ga hon o kudasaimashita.) = Guru memberi saya buku. | お土産をいただきました。 (Omiyage o itadakimashita.) = Saya menerima oleh-oleh.", "lv": "N4", "tags": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "b": 9, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}], "batches": [{"id": 1, "day": 1, "name": "N5 · Perkenalan dan Kalimat Dasar", "at": 0}, {"id": 2, "day": 2, "name": "N5 · Ada, Posisi, dan Perasaan", "at": 0}, {"id": 3, "day": 3, "name": "N5 · Kata Kerja Dasar", "at": 0}, {"id": 4, "day": 4, "name": "N5 · Ajakan, Permintaan, dan Izin", "at": 0}, {"id": 5, "day": 5, "name": "N5 · Kata Sifat dan Perbandingan", "at": 0}, {"id": 6, "day": 6, "name": "N4 · Bentuk Biasa dan Dasar N4", "at": 0}, {"id": 7, "day": 7, "name": "N4 · Perkiraan, Kesan, dan Pendapat", "at": 0}, {"id": 8, "day": 8, "name": "N4 · Syarat, Alasan, dan Meskipun", "at": 0}, {"id": 9, "day": 9, "name": "N4 · Pasif, Potensial, Hormat, dan Memberi-Menerima", "at": 0}]}, "ka": {"cards": [{"id": 1, "jp": "あ", "ro": "", "me": "a", "note": "Contoh: あめ (ame) = hujan. A 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 211, "jp": "ー", "ro": "", "me": "(panjang)", "note": "Tanda ー di katakana artinya bunyi vokal ditarik panjang. Contoh: コーヒー (koohii) = kopi. Di hiragana, vokal panjang ditulis dengan huruf vokal: おかあさん (okaasan).", "lv": "Aturan", "tags": "Aturan Bunyi (wajib tahu)", "b": 28, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 212, "jp": "ゃゅょ", "ro": "", "me": "(kecil)", "note": "ゃ ゅ ょ (kecil) menempel pada huruf sebelumnya jadi satu bunyi: き+ゃ = きゃ (kya). Kalau ditulis besar (や ゆ よ) beda bunyi: きや = ki-ya.", "lv": "Aturan", "tags": "Aturan Bunyi (wajib tahu)", "b": 28, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 213, "jp": "ん / ン (aturan)", "ro": "", "me": "n", "note": "ん / ン dibaca seperti 'n' dan dihitung satu ketukan. Sebelum b/p/m kadang terdengar 'm', tapi tetap ditulis ん. Contoh: ほん (hon), しんぶん (shinbun).", "lv": "Aturan", "tags": "Aturan Bunyi (wajib tahu)", "b": 28, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 214, "jp": "は (partikel)", "ro": "", "me": "wa", "note": "は dibaca 'wa' kalau jadi partikel penanda topik. Contoh: わたしは (watashi wa). Kalau di dalam kata biasa tetap 'ha': はな (hana).", "lv": "Aturan", "tags": "Aturan Bunyi (wajib tahu)", "b": 28, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 215, "jp": "へ (partikel)", "ro": "", "me": "e", "note": "へ dibaca 'e' kalau jadi partikel arah. Contoh: がっこうへ いきます (gakkou e ikimasu). Di dalam kata tetap 'he': へや (heya).", "lv": "Aturan", "tags": "Aturan Bunyi (wajib tahu)", "b": 28, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 216, "jp": "を (partikel)", "ro": "", "me": "o", "note": "を dibaca 'o', hanya dipakai sebagai penanda objek. Contoh: ほんを よみます (hon o yomimasu). Tidak dipakai di dalam kata.", "lv": "Aturan", "tags": "Aturan Bunyi (wajib tahu)", "b": 28, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 217, "jp": "じ・ぢ / ず・づ", "ro": "", "me": "ji / zu", "note": "じ dan ぢ sama-sama 'ji', ず dan づ sama-sama 'zu'. Yang dipakai hampir selalu じ dan ず. ぢ/づ hanya muncul di kata tertentu seperti つづく (tsuzuku).", "lv": "Aturan", "tags": "Aturan Bunyi (wajib tahu)", "b": 28, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 218, "jp": "あさ", "ro": "", "me": "asa · pagi", "note": "Baca dulu, lalu cek.", "lv": "Hira", "tags": "Latihan Baca Cepat · Hiragana", "b": 29, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 219, "jp": "ひる", "ro": "", "me": "hiru · siang", "note": "Baca dulu, lalu cek.", "lv": "Hira", "tags": "Latihan Baca Cepat · Hiragana", "b": 29, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 220, "jp": "よる", "ro": "", "me": "yoru · malam", "note": "Baca dulu, lalu cek.", "lv": "Hira", "tags": "Latihan Baca Cepat · Hiragana", "b": 29, "created": 0, "first": null, "last": null, "next": null, "score": null, "iv": 0, "ease": 2.5, "rc": 0, "ok": 0, "wr": 0, "hd": 0, "ez": 0, "lp": 0}, {"id": 221, "jp": "みず", "ro": "", "me": "mizu · air", "note": "Baca dulu, lalu cek.", "lv": "Hira", "tags": "Latihan Baca Cepat · Hiragana", "b": 29, "created": 0, "first": null, "la function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=q}return p[n]}

 return opts.some(o=>o&&(o==t||(o.length>=5&&lev(o,t)<=1)||(t.length>=4&&o.length>=4&&(o.includes(t)||t.includes(o))&&Math.abs(o.length-t.length)<=3)))}

/* ================= v4: latihan baru, lencana, statistik mudah, tema ================= */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const lng=s=>norm(s).replace(/ou|oo/g,'o').replace(/uu/g,'u').replace(/aa/g,'a').replace(/ii/g,'i').replace(/ee|ei/g,'e');
const meParts=me=>String(me||'').toLowerCase().split(/[,;\/()]|\batau\b/).map(norm).filter(x=>x);
function typeOk(c,inp){const n=norm(inp);if(!n)return false;
 if(String(c.ro||'').split(/[\/,;]/).some(r=>norm(r)&&lng(r)==lng(inp)))return true;
 if(norm(c.ro)&&lng(c.ro)==lng(inp))return true;
 if(norm(c.me)==n)return true;
 return meParts(c.me).some(p=>p==n||(n.length>=4&&p.includes(n)&&n.length>=p.length*.6))}
function logPrac(m,n,ok){D.prac.push({at:Date.now(),m,n,ok});if(D.prac.length>500)D.prac.shift();save()}
const sh=a=>a.slice().sort(()=>Math.random()-.5);
function barTop(p,txt){return`<div class="top"><div class="pg"><i style="width:${p}%"></i></div><span class="m">${txt}</span></div>`}

let T=null;
function startType(){let pool=D.cards.filter(c=>due(c)&&fb(c)).concat(D.cards.filter(c=>!learned(c)&&fb(c)).slice(0,newLeft()));
 if(!pool.length)pool=D.cards.filter(c=>learned(c)&&fb(c)).sort((a,b)=>sc(a)-sc(b));
 pool=sh(pool.slice(0,20));if(!pool.length){toast('Belum ada kartu untuk dilatih.');return}
 S=null;QZ=null;MT=null;TM=null;T={q:pool.map(c=>c.id),i:0,ok:0,no:0,chk:null,val:'',wrong:[],stars0:starInfo().lit};lockWL();render()}
function typeCheck(){const t=T,c=cardById(t.q[t.i]);if(!c||t.chk)return;if(!norm(t.val)){toast('Ketik jawabanmu dulu, atau tekan Tidak tahu.');return}t.chk=typeOk(c,t.val)?'ok':'no';render(1)}
function typeSkip(){T.val='';T.chk='no';render(1)}
function typeNext(fix){const t=T,c=cardById(t.q[t.i]),good=fix||t.chk=='ok';
 if(c){rate(c,good?'ingat':'lupa');if(good)t.ok++;else{t.no++;t.wrong.push(c)}}
 t.i++;t.chk=null;t.val='';render()}
function typeView(){const t=T;
 if(t.i>=t.q.length){if(!t.logged){t.logged=1;relWL();logPrac('ketik',t.ok+t.no,t.ok);badgeCheck()}
  const a=pctOf(t.ok,t.ok+t.no),gain=starInfo().lit-t.stars0;

  (gain>0?`<div class="c lk" onclick="ACT='sky';go('ach')">${ic('star',18)} <b>${gain} bintang baru menyala.</b></div>`:'')+
  (t.wrong.length?`<h3>Perlu diulang</h3><div class="c">${t.wrong.map(c=>`<div class="r"><span>${E(c.jp||c.ro)} <span class="m">${c.jp&&c.ro?E(c.ro):''}</span></span><b>${E(c.me)}</b></div>`).join('')}</div>`:'<div class="c">Semua benar. Bagus sekali.</div>')+
  `<div class="act"><div class="g"><button class="b s" onclick="go('home')" style="margin:0">Home</button><button class="b" onclick="startType()" style="margin:0">Lagi</button></div></div>`}
 const c=cardById(t.q[t.i]);if(!c){t.i++;return typeView()}
 const front=c.jp?`<div class="jp">${E(c.jp)}</div>`:`<div class="mean">${E(c.me)}</div>`,
 hint=c.jp&&c.ro?'Ketik romaji atau artinya':c.jp?'Ketik artinya':'Ketik romaji',
 body=t.chk?`<div class="res ${t.chk}">${t.chk=='ok'?'Benar':'Belum tepat'}</div>${c.ro?`<div class="ro">${E(c.ro)}</div>`:''}<div class="mean" style="font-size:26px">${E(c.me)}</div>${t.chk=='no'&&t.val?`<div class="m">Jawabanmu: ${E(t.val)}</div>`:''}${c.note?`<div class="note">Catatan: ${E(c.note)}</div>`:''}`
 :`<input id="ti" class="ti" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${hint}" value="${E(t.val)}" oninput="T.val=this.value" onkeydown="if(event.key=='Enter')typeCheck()">`;
 const act=!t.chk?`<button class="b" onclick="typeCheck()">Periksa</button><button class="b s" style="margin-top:8px" onclick="typeSkip()">Tidak tahu</button>`
 :t.chk=='ok'?`<button class="b" onclick="typeNext()">Lanjut</button>`:`<div class="g"><button class="b s" style="margin:0" onclick="typeNext(1)">Aku benar (salah ketik)</button><button class="b" style="margin:0" onclick="typeNext()">Lanjut</button></div>`;
 return barTop(Math.round(t.i/t.q.length*100),(t.i+1)+' / '+t.q.length)+`<div class="tools"><span class="m" style="align-self:center">Ketik jawaban</span><button class="ib" onclick="go('study')">Keluar</button></div>
<div class="c fc">${front}<div class="sep"></div>${body}</div><div class="act"><div>${act}</div></div>`}

/* ---------- Cocokkan pasangan ---------- */
let MT=null;
function startMatch(){const pool=D.cards.filter(fb);if(pool.length<6){toast('Butuh minimal 6 kanji.');return}
 const pick=sh(pool).slice(0,Math.min(18,Math.floor(pool.length/6)*6)),rounds=[];for(let i=0;i<pick.length;i+=6)rounds.push(pick.slice(i,i+6).map(c=>c.id));
 S=null;QZ=null;T=null;TM=null;MT={rounds,r:0,miss:0,t0:Date.now(),fin:0,bad:null};matchRound();lockWL();render()}
function matchRound(){const m=MT,ids=m.rounds[m.r];m.L=ids.slice();m.Rt=sh(ids);m.done=[];m.sel=null}
function matchTap(side,id){const m=MT;if(!m||m.bad||m.fin||m.done.includes(id))return;
 if(!m.sel||m.sel.side==side){m.sel={side,id};render(1);return}
 if(m.sel.id==id){m.done.push(id);m.sel=null;render(1);
  if(m.done.length==m.L.length)setTimeout(()=>{if(MT!==m)return;if(m.r+1<m.rounds.length){m.r++;matchRound()}else{m.fin=1;relWL();const n=m.rounds.flat().length;logPrac('cocok',n+m.miss,n);badgeCheck()}render()},450);
  return}
 m.miss++;m.bad=[m.sel,{side,id}];render(1);setTimeout(()=>{if(MT!==m)return;m.bad=null;m.sel=null;render(1)},550)}
function matchView(){const m=MT,tot=m.rounds.flat().length;
 if(m.fin){const secs=Math.max(1,Math.round((Date.now()-m.t0)/1000));return`<h2>Selesai</h2><div class="c"><div class="n">${fmtMin(secs)}</div><div class="m">${tot} pasangan · salah pilih ${m.miss} kali</div>${scoreLine()}</div><div class="act"><div class="g"><button class="b s" onclick="go('home')" style="margin:0">Home</button><button class="b" onclick="startMatch()" style="margin:0">Main lagi</button></div></div>`}
 const st=(side,id)=>m.done.includes(id)?' ok':m.bad&&m.bad.some(b=>b.side==side&&b.id==id)?' no':m.sel&&m.sel.side==side&&m.sel.id==id?' on':'';
 return barTop(Math.round((m.r*6+m.done.length)/tot*100),'Babak '+(m.r+1)+' / '+m.rounds.length)+`<div class="tools"><span class="m" style="align-self:center">Cocokkan pasangan</span><button class="ib" onclick="go('study')">Keluar</button></div><p class="m">Ketuk kata Jepang, lalu ketuk artinya.</p>
<div class="mtg"><div>${m.L.map(id=>{const c=cardById(id);return`<button class="mt${st('L',id)}" onclick="matchTap('L',${id})"><span class="jj">${E(c.jp||c.ro)}</span>${c.jp&&c.ro?`<small>${E(c.ro)}</small>`:''}</button>`}).join('')}</div><div>${m.Rt.map(id=>{const c=cardById(id);return`<button class="mt${st('R',id)}" onclick="matchTap('R',${id})">${E(c.me)}</button>`}).join('')}</div></div>`}

 if(left<=0&&!m.fin){m.fin=1;clearInterval(TMH);relWL();logPrac('t60',m.ok+m.no,m.ok);const b=D.set.best60||0;m.nb=m.ok>b&&m.ok>0;if(m.nb){D.set.best60=m.ok;save()}badgeCheck();render();return}
 const v=$('#tmv'),b=$('#tmb');if(v)v.textContent=Math.ceil(left/1000);if(b)b.style.width=(left/600)+'%'}

<div class="c fc" style="min-height:150px;padding:20px 12px">${it.dir=='jp'?`<div class="jp" style="font-size:38px">${E(c.jp||c.ro)}</div>${c.jp&&c.ro?`<div class="ro">${E(c.ro)}</div>`:''}`:`<div class="mean" style="font-size:28px">${E(c.me)}</div>`}</div>`+
 it.opts.map((o,k)=>`<button class="op" onclick="t60Pick(${k})">${it.dir=='jp'?E(o.me):E(o.jp||o.ro)+(o.jp&&o.ro?` <span class="m">${E(o.ro)}</span>`:'')}</button>`).join('')}

function gameView(){const tl=[["startMatch()",'swap','Matching','Cocokkan kata & arti','#6f7dff'],["startType()",'keyboard','Typing','Ketik romaji','#2de1d3'],["startQuiz()",'help','Quiz','Cepat & tepat','#a78bfa'],["startMem()",'cards','Memory','Ingat kata','#fbbf24']];
 return hdr('Game Mode')+`<div class="gg">${tl.map(t=>`<button class="gt2" onclick="${t[0]}" style="--tc:${t[4]}"><span class="ti2">${I(t[1],28)}</span><b>${t[2]}</b><small>${t[3]}</small></button>`).join('')}</div>${row('startT60()','bolt','Tantangan 60 Detik','Jawab sebanyak mungkin'+(D.set.best60?' · rekor '+D.set.best60:''),'#fb7185')}${row("go('listen')",'ear','Latihan Mendengar','Dengar lalu pilih arti','#60a5fa')}
<div class="c hs">${I('trophy',22)}<span>Skor Tertinggi</span><b>${fmtN(D.set.hi||0)}</b></div>`}
function startMem(){const pool=D.cards.filter(fb);if(pool.length<8){toast('Butuh minimal 8 kanji.');return}
 S=null;QZ=null;T=null;MT=null;TM=null;const t=[];sh(pool).slice(0,8).forEach(c=>{t.push({id:c.id,k:'j',x:c.jp||c.ro});t.push({id:c.id,k:'m',x:c.me})});
 MG={t:sh(t),open:[],done:[],moves:0,t0:Date.now(),fin:0,bad:0};lockWL();render()}
function memTap(i){const m=MG;if(!m||m.fin||m.bad||m.done.includes(i)||m.open.includes(i))return;m.open.push(i);render(1);
 if(m.open.length==2){m.moves++;const a=m.t[m.open[0]],b=m.t[m.open[1]];
  if(a.id==b.id&&a.k!=b.k){m.done.push(m.open[0],m.open[1]);m.open=[];render(1);
   if(m.done.length==16)setTimeout(()=>{if(MG!==m)return;m.fin=1;relWL();const secs=Math.round((Date.now()-m.t0)/1000);logPrac('memori',m.moves,8,Math.max(50,1000-m.moves*25-secs*3));badgeCheck();render()},500)}
  else{m.bad=1;setTimeout(()=>{if(MG!==m)return;m.open=[];m.bad=0;render(1)},750)}}}
function memView(){const m=MG;
 if(m.fin){const secs=Math.max(1,Math.round((Date.now()-m.t0)/1000));return`<h2>Selesai</h2><div class="c"><div class="n">${m.moves} <small>langkah · ${fmtMin(secs)}</small></div>${scoreLine()}</div><div class="act"><div class="g"><button class="b s" onclick="go('game')" style="margin:0">Game</button><button class="b" onclick="startMem()" style="margin:0">Main lagi</button></div></div>`}
 return barTop(Math.round(m.done.length/16*100),'Langkah '+m.moves)+`<div class="tools"><span class="m" style="align-self:center">Memory · ingat kata</span><button class="ib" onclick="go('game')">Keluar</button></div><p class="m">Ketuk dua kotak: kata Jepang dan artinya harus cocok.</p><div class="mg">${m.t.map((x,i)=>{const sh2=m.open.includes(i)||m.done.includes(i);return`<button class="mc${m.done.includes(i)?' ok':''}${m.bad&&m.open.includes(i)?' no':''}${x.k=='j'?' jj':''}" onclick="memTap(${i})">${sh2?E(x.x):I('star',20)}</button>`}).join('')}</div>`}
