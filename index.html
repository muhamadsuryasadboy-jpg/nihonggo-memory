 dt('b','book','Belajar','Batas kata baru, arah kartu',`<div class="m">Minggu mulai hari</div>${sel('wkStart',[[1,'Senin'],[0,'Minggu']])}<div class="m">Batas kanji baru per hari</div>${sel('target',[[0,'Tanpa batas'],[10,10],[20,20],[30,30],[50,50],[100,100],[200,200]])}<div class="m">Kartu per sesi latihan (kata sulit, acak, semua). Kata sulit dibagi jadi grup.</div>${sel('pn',[[0,'Semua (tanpa batas)'],[10,10],[20,20],[30,30],[50,50],[100,100]])}<div class="m">Putar suara otomatis saat jawaban dibuka</div>${sel('au',[['1','Hidup'],['0','Mati']])}<div class="m">Paket 5 kata baru: ulangan per kata (pilih 'Sampai aku tekan Hafal' kalau mau kamu yang menentukan)</div>${sel('rn',[[0,'Sampai aku tekan Hafal'],[3,3],[5,5],[8,8],[10,10],[15,15]])}<div class="m">Mode fokus: jumlah kata per sesi</div>${sel('fn',[[5,5],[10,10],[15,15],[20,20]])}<div class="m">Tebak dulu dengan mengetik jawaban (lebih jujur, tapi lebih lama)</div>${sel('tp',[['0','Mati'],['1','Hidup']])}<div class="m">Arah kartu</div>${sel('dir',[['jp','Jepang ke Indonesia'],['id','Indonesia ke Jepang'],['rand','Acak']])}<label class="ck"><input type="checkbox" ${s.hideRo?'checked':''} onchange="setS('hideRo',this.checked)"> Sembunyikan romaji sampai jawaban dibuka</label><div class="m" style="margin-top:12px"><b>Koreksi hari beruntun (manual)</b></div><input type="number" id="skn" class="in" min="1" max="365" value="${(s.skDays||[]).length?(s.skDays.length+1):16}" style="width:100%"><div class="g"><button class="b s" onclick="fixStreak()">Terapkan</button><button class="b s" onclick="clearStreakFix()">Hapus koreksi</button></div><p class="m">Ini koreksi manual buatanmu sendiri, bukan riwayat belajar asli. Statistik lain (jumlah jawaban, hari belajar) tidak berubah.${(s.skDays||[]).length?' Koreksi aktif: '+(s.skDays.length+1)+' hari.':''}</p>`)+
 dt('k','save','Cadangan Data',bd==null?'Belum pernah backup':'Backup terakhir '+bd+' hari lalu',`<p class="m">Backup berisi semua: kanji, bab, jadwal ulang, riwayat jawaban (hari beruntun), kata sulit, catatan, dan setelan. Salin atau bagikan ke Catatan / WhatsApp. Untuk memulihkan, tempel atau pilih berkas, lalu pilih Gabungkan.</p><button class="b sm" onclick="mkBackup()">Buat backup</button><button class="b s sm" onclick="cpBackup()">Salin</button><button class="b s sm" onclick="shBackup()">Bagikan</button><textarea id="bk" placeholder="Teks backup muncul atau ditempel di sini"></textarea><label class="m" style="display:block;margin:8px 0 2px">Atau pilih berkas backup (.txt / .json)</label><input type="file" accept=".txt,.json,text/plain,application/json" onchange="bkFile(this)" style="margin-bottom:6px"><button class="b s" onclick="restore1()">Baca backup ini</button><div id="rs"></div>${prevBk()?`<button class="b s" onclick="undoRestore()">Batalkan pemulihan terakhir (${(prevBk().cards||[]).length} kanji)</button>`:''}`)+
 dt('h','help','Bantuan & FAQ','Cara pakai singkat',`<p><b>Cara belajar:</b> Belajar → Kanji baru. Tekan Tampilkan jawaban, lalu pilih Ulang, Sulit, Baik, atau Mudah. Aplikasi mengatur kapan kata muncul lagi.</p><p><b>Hafal itu apa?</b> Kata dengan Memory Score 90 ke atas.</p><p><b>Bintang menyala:</b> 1 bintang tiap 20 kata yang sudah dipelajari, jadi emas tiap 20 kata yang kuat (skor 70+).</p><p><b>Data aman?</b> Data hanya ada di HP ini. Buat backup berkala, terutama sebelum memasang APK baru.</p><p><b>Hari libur beruntun:</b> bolos satu hari per minggu tidak memutus rangkaian.</p>`)+
 dt('a','info','Tentang Aplikasi','Kanji Memory · Galaxy Edition',`<p>Aplikasi hafalan kanji bahasa Jepang yang bekerja tanpa internet. Semua data tersimpan di HP kamu.</p><p class="m">ことば メモリー · Galaxy Edition</p>`)}

IC.music='<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>';
IC.play='<path d="M7 4l13 8-13 8z"/>';IC.pause='<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>';IC.next='<path d="M5 4l10 8-10 8zM19 5v14"/>';IC.prev='<path d="M19 4L9 12l10 8zM5 5v14"/>';IC.vol='<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 010 6"/>';
const mf=m=>440*Math.pow(2,(m-69)/12);
const TRACKS=[
 {id:'nebula',n:'Nebula Drift',d:'Pad lembut dan tenang, cocok untuk fokus',bpm:54,ch:[[57,60,64,69],[53,60,65,69],[55,60,64,67],[55,59,62,67]],sc:[69,72,74,76,79,81],mode:'spark'},
 {id:'orbit',n:'Orbit Tenang',d:'Petikan pelan yang berputar, seperti mengorbit bintang',bpm:66,ch:[[50,57,62,65],[46,53,58,62],[48,55,60,64],[45,52,57,60]],sc:[],mode:'arp'},
 {id:'aurora',n:'Fajar Aurora',d:'Hangat dan terang, seperti cahaya aurora',bpm:60,ch:[[62,66,69,74],[57,64,69,73],[59,66,71,74],[55,62,67,71]],sc:[74,76,78,81,83],mode:'mel'}];
const MUS={ctx:null,out:null,bus:null,dl:null,t:0,on:false,h:null,nx:0,st:0,vol:1,k:2};
function applyLite(){try{document.documentElement.classList.toggle('lite',!!(D.set.lite||MUS.on))}catch(e){}}
function musInit(){if(MUS.ctx)return true;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw 0;let c;try{c=new C({latencyHint:'playback'})}catch(e){c=new C()}MUS.ctx=c;
 const out=c.createGain();out.gain.value=MUS.vol*MUS.k;const cp=c.createDynamicsCompressor();cp.threshold.value=-10;cp.knee.value=6;cp.ratio.value=20;cp.attack.value=.003;cp.release.value=.25;
 out.connect(cp);cp.connect(c.destination);MUS.out=out;return true}catch(e){MUS.ctx=null;toast('Musik tidak didukung di perangkat ini.');return false}}
function musBus(){const c=MUS.ctx,bus=c.createGain();bus.gain.value=0;bus.connect(MUS.out);MUS.bus=bus;return bus}
function mv(f,t,dur,o){const c=MUS.ctx,bus=MUS.bus;if(!bus)return;const osc=c.createOscillator(),g=c.createGain();osc.type=o.type;osc.frequency.value=f;osc.connect(g);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.v,t+o.a);g.gain.setValueAtTime(o.v,t+Math.max(o.a,dur-o.r));g.gain.linearRampToValueAtTime(0,t+dur);
 g.connect(bus);let s=null;if(o.dl){s=c.createGain();s.gain.value=o.dl;g.connect(s);s.connect(MUS.dl)}
 osc.onended=()=>{try{g.disconnect();if(s)s.disconnect()}catch(e){}};osc.start(t);osc.stop(t+dur+.05)}
function bell(f,t,v,d){d=d||2.4;mv(f,t,d,{type:'sine',v:v,a:.008,r:d-.1});mv(f*2,t,d/2,{type:'sine',v:v*.22,a:.008,r:d/2-.1})}
function musTick(){if(!MUS.on||!MUS.bus)return;const c=MUS.ctx,tr=TRACKS[MUS.t],beat=60/tr.bpm;if(MUS.nx<c.currentTime)MUS.nx=c.currentTime+.05;
 while(MUS.nx<c.currentTime+3){const t=MUS.nx,s=MUS.st,bar=Math.floor(s/4),pos=s%4,ch=tr.ch[bar%tr.ch.length].map(n=>n<53?n+12:n);
  if(pos==0)ch.forEach(n=>mv(mf(n),t,beat*4+1.2,{type:'sine',v:.13,a:1.4,r:2}));
  if(tr.mode=='spark'&&Math.random()<.55)bell(mf(tr.sc[Math.floor(Math.random()*tr.sc.length)]),t+(Math.random()<.5?0:beat/2),.2);
  if(tr.mode=='arp')[0,1].forEach(k=>bell(mf(ch[(pos*2+k)%4]),t+k*beat/2,.17,1.5));
  if(tr.mode=='mel'&&(pos==0||pos==2)&&Math.random()<.85)bell(mf(tr.sc[(pos+bar*2)%tr.sc.length]),t,.2);
  MUS.nx+=beat;MUS.st++}}
function musKill(){const c=MUS.ctx;if(!c||!MUS.bus)return;const b=MUS.bus;MUS.bus=null;clearInterval(MUS.h);try{b.gain.cancelScheduledValues(c.currentTime);b.gain.setValueAtTime(b.gain.value,c.currentTime);b.gain.linearRampToValueAtTime(0,c.currentTime+.5)}catch(e){}setTimeout(()=>{try{b.disconnect()}catch(e){}},700)}
function musPlay(i){if(!musInit())return;const c=MUS.ctx;if(i!=null)MUS.t=i;musKill();
 const run=()=>{const b=musBus();MUS.on=true;MUS.nx=c.currentTime+.15;MUS.st=0;b.gain.setValueAtTime(0,c.currentTime);b.gain.linearRampToValueAtTime(1,c.currentTime+1.5);MUS.out.gain.value=MUS.vol*MUS.k;MUS.h=setInterval(musTick,700);musTick();applyLite();D.set.mt=MUS.t;save();render(1)};
 if(c.state!=='running')c.resume().then(run).catch(run);else run()}
function musStop(){const c=MUS.ctx;if(!c)return;MUS.on=false;musKill();applyLite();setTimeout(()=>{if(!MUS.on)try{c.suspend()}catch(e){}},900);render(1)}
function musToggle(){if(MUS.on)musStop();else musPlay(D.set.mt||0)}
function musPick(i){if(MUS.on&&MUS.t==i){musStop();return}musPlay(i)}
function musStep(d){const i=((MUS.on?MUS.t:(D.set.mt||0))+d+TRACKS.length)%TRACKS.length;if(MUS.on)musPlay(i);else{MUS.t=i;D.set.mt=i;save();render(1)}}
let _mvh=null;
function musVol(v){MUS.vol=v/100;D.set.mv=+v;if(MUS.out&&MUS.ctx)MUS.out.gain.setTargetAtTime(MUS.vol*MUS.k,MUS.ctx.currentTime,.1);clearTimeout(_mvh);_mvh=setTimeout(save,500)}
function musAuto(){if(D.set.mauto&&!MUS.on)musPlay(D.set.mt||0)}
const _lw=lockWL;lockWL=function(){_lw();musAuto()};
if(!D.set.mv3){D.set.mv=100;D.set.mv3=1;save()}MUS.vol=(D.set.mv!=null?D.set.mv:100)/100;MUS.t=D.set.mt||0;
function musicView(){const t=TRACKS[MUS.on?MUS.t:(D.set.mt||0)],on=MUS.on;
 return hdr('Musik Angkasa')+`<div class="c mus ${on?'pl':''}"><div class="orb"><svg viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="pl1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#bfc8ff"/><stop offset=".55" stop-color="#5b6cff"/><stop offset="1" stop-color="#1b1f7a"/></radialGradient></defs><ellipse cx="100" cy="100" rx="88" ry="30" fill="none" stroke="rgba(170,180,255,.45)" stroke-width="2" transform="rotate(-18 100 100)"/><circle cx="100" cy="100" r="42" fill="url(#pl1)"/><ellipse cx="100" cy="100" rx="88" ry="30" fill="none" stroke="rgba(200,210,255,.8)" stroke-width="2.4" stroke-dasharray="140 400" stroke-dashoffset="-190" transform="rotate(-18 100 100)"/><g class="sat"><circle cx="100" cy="14" r="5" fill="#fff"/></g></svg></div>
<div class="eq">${[0,1,2,3,4].map(i=>`<i style="animation-delay:${i*.15}s"></i>`).join('')}</div><b style="font-size:22px">${t.n}</b><div class="m" style="margin:4px 0 14px">${t.d}</div>
<div class="mctl"><button class="mb2" onclick="musStep(-1)" aria-label="Sebelumnya">${I('prev',22)}</button><button class="mb2 big" onclick="musToggle()" aria-label="${on?'Jeda':'Putar'}">${I(on?'pause':'play',30)}</button><button class="mb2" onclick="musStep(1)" aria-label="Berikutnya">${I('next',22)}</button></div>
<div class="vr">${I('vol',18)}<input type="range" min="0" max="100" value="${Math.round(MUS.vol*100)}" oninput="musVol(this.value)" aria-label="Volume"></div></div>
<h3>Pilih lagu</h3>${TRACKS.map((x,i)=>`<button class="row" onclick="musPick(${i})"><span class="ri" style="--tc:${['#6f7dff','#2de1d3','#a78bfa'][i]}">${I(on&&MUS.t==i?'pause':'play',20)}</span><span class="rt2"><b>${x.n}</b><small>${x.d}</small></span><span class="m">${i+1}/3</span></button>`).join('')}
<label class="ck"><input type="checkbox" ${D.set.mauto?'checked':''} onchange="D.set.mauto=this.checked;save()"> Putar musik otomatis saat mulai belajar</label><p class="m">Ketiga lagu dibuat langsung oleh aplikasi (instrumental ambient bertema angkasa), jadi tetap jalan tanpa internet.</p>`}
function miniBar(){const m=$('#mini');if(!m)return;const show=MUS.on&&!(S||QZ||T||MT||TM||MG)&&V!='splash'&&V!='music';m.hidden=!show;document.body.classList.toggle('mp',show);
 if(show){const t=TRACKS[MUS.t];m.innerHTML=`<span class="eq sm">${[0,1,2].map(i=>`<i style="animation-delay:${i*.15}s"></i>`).join('')}</span><button class="mt3" onclick="go('music')"><b>${t.n}</b><small>Musik Angkasa</small></button><button class="mb2" onclick="musToggle()" aria-label="Jeda">${I('pause',18)}</button>`}}
